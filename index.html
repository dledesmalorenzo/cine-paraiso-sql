<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cine Paraíso · laboratorio de SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1ea;--panel:#fffdf8;--ink:#221d22;--muted:#6f6670;--line:#e4ddd2;--accent:#8c1c2b;--accent2:#e2a93b;--ok:#2f7d4f;--okbg:#e6f3ea;--err:#a8412f;--errbg:#f8e6e1;--code:#f1eee6}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{padding:22px 28px 12px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:26px;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted)}
.acciones{margin-left:auto;display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 28px 0;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap;color:var(--muted)}
.tab.activa{color:var(--ink);border-bottom-color:var(--accent2);font-weight:700}
.tab .cnt{font-size:12px;background:var(--code);border-radius:10px;padding:1px 7px;margin-left:6px}
.tab .cnt.lleno{background:var(--okbg);color:var(--ok)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:24px;padding:20px 28px 60px;max-width:1300px}
aside{position:sticky;top:60px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100vh - 80px);overflow:auto}
aside h3{margin:4px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
aside .ayuda{font-size:13px;color:var(--muted);margin:0 0 10px}
.tabla{border-top:1px solid var(--line)}
.tabla>button{width:100%;text-align:left;border:none;background:none;padding:7px 2px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:14px}
.tabla>button small{color:var(--muted);font-family:'DM Sans';font-size:12px}
.cols{display:none;padding:0 0 8px 8px}
.tabla.abierta .cols{display:block}
.col{display:block;width:100%;text-align:left;border:none;background:none;padding:2px 4px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent)}
.col small{color:var(--muted);font-family:'DM Sans'}
.col:hover{background:var(--code)}
main h2{margin:6px 0 10px;font-size:24px}
.teoria{background:var(--panel);border-left:4px solid var(--accent);border-radius:8px;padding:12px 18px;margin-bottom:22px}
.teoria pre,.sol pre{background:var(--code);padding:10px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:14px;overflow:auto;margin:8px 0}
code{font-family:'JetBrains Mono',monospace;background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.ej{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.ej.hecho{border-color:#b7d8c2}
.ej .cab{display:flex;align-items:center;gap:10px}
.ej .num{font-weight:700;color:var(--accent)}
.ej .estado{margin-left:auto;font-size:13px;color:var(--ok);font-weight:700}
.ej .tit{font-weight:700}
.ej p.enun{margin:6px 0}
.esperado{font-size:14px;color:var(--muted)}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:14px}
.pista{display:none;background:#fff6e3;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.pista.ver{display:block}
textarea{width:100%;min-height:96px;font-family:'JetBrains Mono',monospace;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;margin-top:8px}
textarea:focus{outline:2px solid var(--accent2);border-color:transparent}
.barra{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.ejecutar{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;padding:7px 18px}
.ejecutar:hover{filter:brightness(1.1)}
.atajo{font-size:13px;color:var(--muted)}
.barra .derecha{margin-left:auto}
.msg{margin-top:10px;border-radius:8px;padding:9px 12px;font-size:15px;display:none}
.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
.msg.err{display:block;background:var(--errbg);color:var(--err)}
.msg code{background:rgba(0,0,0,.05)}
.res{overflow:auto;margin-top:10px;max-height:380px}
.res table{border-collapse:collapse;font-size:14px;font-family:'JetBrains Mono',monospace}
.res th,.res td{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap;max-width:520px;overflow:hidden;text-overflow:ellipsis}
.res td.largo{white-space:normal;min-width:320px}
.res th{background:var(--code);position:sticky;top:0}
.res .null{color:#aaa;font-style:italic}
.res .mas{font-size:13px;color:var(--muted);margin-top:4px}
.sol{display:none;margin-top:8px}
.sol.ver{display:block}
.acusar{background:var(--panel);border:2px solid var(--accent2);border-radius:12px;padding:18px;margin-top:10px}
.acusar h3{margin:0 0 6px}
.acusar form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acusar input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.cargando{padding:60px;text-align:center;color:var(--muted)}
.resumen{color:var(--muted);margin:-4px 0 14px}
@media (max-width:820px){.layout{grid-template-columns:1fr;padding:14px}aside{position:static;max-height:none}header,.tabs{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Cine <span>Paraíso</span></h1>
    <p>Laboratorio de SQL · SQLite en el navegador · los ejercicios se corrigen solos</p>

,'bar','Se acaban las palomitas grandes a las 21:00. Sergio pide subir el pedido de los viernes.'),(4,'2026-11-02','taquilla','Cola de 40 minutos en el estreno. Se abre una segunda ventanilla.'),(5,'2026-11-10','gerencia','Javier revisa las entradas de octubre y noviembre. El código PASE-EQUIPO deja la entrada gratis, y solo puede usarlo el personal del cine con su cuenta de socio, desde la app. Pero aparece en muchas más entradas de las que tocan. El código está en la columna codigo_promo de la tabla entradas.'),(6,'2026-11-10','proyeccion','Cambio de lámpara en la Sala 2.'),(7,'2026-11-11','sistemas','Laura Méndez (taquilla, turno de tarde) reconoce que no cierra su sesión en el ordenador de la taquilla al acabar el turno: \"así al día siguiente lo tengo todo abierto\". Ese ordenador lo usa también el turno de noche.'),(8,'2026-11-11','sistemas','El programa de venta guarda en vendida_por el usuario que tenía la sesión abierta, no quién estaba sentado en la taquilla.'),(9,'2026-11-12','gerencia','Carmen, la gerente, quiere saber antes del viernes quién está regalando entradas y cuánto dinero ha dejado de ingresar el cine.');";
const BLOQUES = [{"id": "b1", "titulo": "1. SELECT", "teoria": "<p><code>SELECT</code> dice <b>qué columnas</b> quieres ver y <code>FROM</code> <b>de qué tabla</b>. Con <code>*</code> ves todas.</p><pre>SELECT columna1, columna2\nFROM tabla;</pre>", "ej": [{"id": "1.1", "e": "Muestra todas las columnas de todas las salas del cine.", "sol": "SELECT * FROM salas", "p": "Todas las columnas se piden con un asterisco. La tabla es salas."}, {"id": "1.2", "e": "Muestra el título y el director de cada película.", "sol": "SELECT titulo, director FROM peliculas", "p": "Dos columnas separadas por una coma, de la tabla peliculas (sin tilde)."}, {"id": "1.3", "e": "Muestra el título, el género y la duración de cada película.", "sol": "SELECT titulo, genero, duracion FROM peliculas", "p": "Tres columnas. Comprueba en el panel cómo se escriben."}, {"id": "1.4", "e": "Muestra el nombre y la ciudad de cada socio.", "sol": "SELECT nombre, ciudad FROM socios", "p": "Tabla socios."}, {"id": "1.5", "e": "Muestra el producto y el importe de todas las ventas del bar.", "sol": "SELECT producto, importe FROM ventas_bar", "p": "La tabla se llama ventas_bar, con guion bajo."}]}, {"id": "b2", "titulo": "2. WHERE", "teoria": "<p><code>WHERE</code> se queda solo con las <b>filas</b> que cumplen una condición. Los textos y las fechas van entre comillas simples; los números, sin comillas.</p><pre>SELECT *\nFROM tabla\nWHERE columna = 'valor';</pre><p>Comparaciones: <code>=</code> <code>!=</code> <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code></p>", "ej": [{"id": "2.1", "e": "¿Qué películas de terror hay en cartelera? Muestra el título y el año de estreno.", "sol": "SELECT titulo, estreno FROM peliculas WHERE genero = 'terror'", "p": "Filtra por la columna genero. Los géneros están en minúsculas y sin tildes."}, {"id": "2.2", "e": "Muestra todas las columnas de la sala de tipo IMAX.", "sol": "SELECT * FROM salas WHERE tipo = 'IMAX'", "p": "Filtra por la columna tipo. 'IMAX' va en mayúsculas."}, {"id": "2.3", "e": "¿Qué películas duran más de 150 minutos? Muestra el título y la duración.", "sol": "SELECT titulo, duracion FROM peliculas WHERE duracion > 150", "p": "La duración es un número: sin comillas."}, {"id": "2.4", "e": "¿Qué socios son de La Laguna? Muestra el nombre y el apellido.", "sol": "SELECT nombre, apellido FROM socios WHERE ciudad = 'La Laguna'", "p": "Filtra por ciudad. Escríbela igual que en la tabla, con mayúsculas."}, {"id": "2.5", "e": "¿Qué películas son solo para mayores de 18? Muestra el título.", "sol": "SELECT titulo FROM peliculas WHERE edad = '18'", "p": "Ojo: la columna edad es de texto (puede valer 'TP', '7', '12', '16' o '18'), así que el valor va entre comillas."}, {"id": "2.6", "e": "¿Qué películas se estrenaron antes de 1990? Muestra el título y el año de estreno.", "sol": "SELECT titulo, estreno FROM peliculas WHERE estreno < 1990", "p": "«Antes de 1990» no incluye 1990."}]}, {"id": "b3", "titulo": "3. AND, OR, LIKE", "teoria": "<p><code>AND</code>: se cumplen las dos condiciones. <code>OR</code>: basta con una. <code>BETWEEN a AND b</code>: entre dos valores, ambos incluidos. <code>LIKE</code> busca un patrón: <code>%</code> es «cualquier cosa».</p><pre>WHERE genero = 'drama' AND duracion &gt; 120\nWHERE estreno BETWEEN 2000 AND 2010\nWHERE titulo LIKE 'El %'</pre><p>Si mezclas AND y OR, usa paréntesis.</p>", "ej": [{"id": "3.1", "e": "¿Qué películas de ciencia ficción duran más de 140 minutos? Muestra el título y la duración.", "sol": "SELECT titulo, duracion FROM peliculas WHERE genero = 'ciencia ficcion' AND duracion > 140", "p": "Dos condiciones a la vez. El género es 'ciencia ficcion', sin tilde."}, {"id": "3.2", "e": "¿Qué películas son comedias o de animación? Muestra el título y el género.", "sol": "SELECT titulo, genero FROM peliculas WHERE genero = 'comedia' OR genero = 'animacion'", "p": "Basta con que se cumpla una de las dos."}, {"id": "3.3", "e": "¿Qué títulos empiezan por «El »? Muestra el título.", "sol": "SELECT titulo FROM peliculas WHERE titulo LIKE 'El %'", "p": "Empieza por «El » (con el espacio): el % va al final."}, {"id": "3.4", "e": "¿Qué películas se estrenaron entre 2000 y 2010, los dos incluidos? Muestra el título y el año.", "sol": "SELECT titulo, estreno FROM peliculas WHERE estreno BETWEEN 2000 AND 2010", "p": "BETWEEN incluye los dos extremos."}, {"id": "3.5", "e": "¿Qué sesiones hubo en noviembre de 2026? Muestra el id y la fecha.", "sol": "SELECT id, fecha FROM sesiones WHERE fecha LIKE '2026-11%'", "p": "Todas las fechas de noviembre empiezan por '2026-11'."}, {"id": "3.6", "e": "¿Qué ventas del bar de palomitas grandes o de nachos superan los 15 €? Muestra el id, el producto y el importe.", "sol": "SELECT id, producto, importe FROM ventas_bar WHERE (producto = 'Palomitas grandes' OR producto = 'Nachos') AND importe > 15", "p": "Mezclas OR y AND: pon el OR entre paréntesis. Sin ellos te saldrían todas las palomitas grandes, cuesten lo que cuesten."}]}, {"id": "b4", "titulo": "4. ORDER BY", "teoria": "<p><code>ORDER BY</code> ordena: <code>ASC</code> de menor a mayor (por defecto), <code>DESC</code> de mayor a menor. <code>LIMIT n</code> se queda con las primeras n filas.</p><pre>SELECT titulo, duracion\nFROM peliculas\nORDER BY duracion DESC\nLIMIT 3;</pre><p>Orden: SELECT → FROM → WHERE → ORDER BY → LIMIT.</p>", "ej": [{"id": "4.1", "e": "Muestra todas las películas de la más larga a la más corta, con el título y la duración.", "sol": "SELECT titulo, duracion FROM peliculas ORDER BY duracion DESC", "orden": [1, true], "p": "¿Por qué columna ordenas? ¿ASC o DESC?"}, {"id": "4.2", "e": "¿Cuáles son las 3 películas más antiguas? Muestra el título y el año de estreno.", "sol": "SELECT titulo, estreno FROM peliculas ORDER BY estreno ASC LIMIT 3", "orden": [1, false], "p": "Las más antiguas tienen el año más bajo."}, {"id": "4.3", "e": "¿Qué sala tiene más aforo? Muestra el nombre y el aforo.", "sol": "SELECT nombre, aforo FROM salas ORDER BY aforo DESC LIMIT 1", "p": "La más grande arriba, y te quedas con una fila."}, {"id": "4.4", "e": "Muestra los socios del más nuevo al más antiguo, con el nombre y la fecha de alta.", "sol": "SELECT nombre, fecha_alta FROM socios ORDER BY fecha_alta DESC", "orden": [1, true], "p": "El más nuevo tiene la fecha de alta más reciente (la mayor)."}, {"id": "4.5", "e": "¿Cuáles son las 5 películas más largas? Muestra el título y la duración.", "sol": "SELECT titulo, duracion FROM peliculas ORDER BY duracion DESC LIMIT 5", "orden": [1, true], "p": "Como el 4.1, pero cortando con LIMIT."}]}, {"id": "b5", "titulo": "5. COUNT, SUM, AVG", "teoria": "<p>Funciones que resumen muchas filas en un número:</p><pre>COUNT(*)      cuántas filas\nSUM(columna)  la suma\nAVG(columna)  la media\nMIN / MAX     el mínimo y el máximo\nROUND(x, 2)   redondea a 2 decimales</pre>", "ej": [{"id": "5.1", "e": "¿Cuántas entradas se han vendido en total?", "sol": "SELECT COUNT(*) FROM entradas", "p": "Contar filas: COUNT(*)."}, {"id": "5.2", "e": "¿Cuántas películas de animación hay?", "sol": "SELECT COUNT(*) FROM peliculas WHERE genero = 'animacion'", "p": "Cuenta, pero solo las filas que cumplen una condición."}, {"id": "5.3", "e": "¿Cuánto se ha ingresado con las entradas? (la suma de la columna importe)", "sol": "SELECT SUM(importe) FROM entradas", "p": "SUM sobre importe, que es lo que pagó cada espectador."}, {"id": "5.4", "e": "¿Cuál es la nota media de las reseñas, redondeada a 2 decimales?", "sol": "SELECT ROUND(AVG(nota), 2) FROM resenas", "p": "AVG va dentro de ROUND."}, {"id": "5.5", "e": "¿Cuánto dura la película más corta y cuánto la más larga? Las dos en la misma consulta.", "sol": "SELECT MIN(duracion), MAX(duracion) FROM peliculas", "p": "Dos funciones en el SELECT, separadas por una coma."}, {"id": "5.6", "e": "¿Cuánto se ha vendido en palomitas (de cualquier tamaño, sin contar el menú)?", "sol": "SELECT SUM(importe) FROM ventas_bar WHERE producto LIKE 'Palomitas%'", "p": "Los productos de palomitas empiezan por 'Palomitas'. El menú empieza por 'Menú', así que no entra."}]}, {"id": "b6", "titulo": "6. GROUP BY", "teoria": "<p><code>GROUP BY</code> hace un grupo por cada valor de una columna y calcula la función para cada grupo. Cuando el enunciado dice «por cada…», toca agrupar. <code>HAVING</code> filtra <b>grupos</b> después de agrupar (WHERE filtra filas antes).</p><pre>SELECT genero, COUNT(*)\nFROM peliculas\nWHERE estreno &gt; 2000\nGROUP BY genero\nHAVING COUNT(*) &gt; 2;</pre>", "ej": [{"id": "6.1", "e": "¿Cuántas entradas se vendieron por cada canal? Muestra el canal y cuántas.", "sol": "SELECT canal, COUNT(*) FROM entradas GROUP BY canal", "p": "Agrupa por la columna que va después de «cada»."}, {"id": "6.2", "e": "¿Cuántas películas hay de cada género? Muestra el género y cuántas.", "sol": "SELECT genero, COUNT(*) FROM peliculas GROUP BY genero", "p": "GROUP BY genero."}, {"id": "6.3", "e": "¿Cuánto se ha vendido de cada producto en el bar? Muestra el producto y el total, de más a menos.", "sol": "SELECT producto, SUM(importe) FROM ventas_bar GROUP BY producto ORDER BY SUM(importe) DESC", "orden": [1, true], "p": "Agrupa, suma y ordena por la suma."}, {"id": "6.4", "e": "¿Cuántos socios hay de cada ciudad? Muestra la ciudad y cuántos, de más a menos.", "sol": "SELECT ciudad, COUNT(*) FROM socios GROUP BY ciudad ORDER BY COUNT(*) DESC", "orden": [1, true], "p": "Como el 6.3, pero contando."}, {"id": "6.5", "e": "¿Qué géneros tienen más de 3 películas? Muestra el género y cuántas.", "sol": "SELECT genero, COUNT(*) FROM peliculas GROUP BY genero HAVING COUNT(*) > 3", "p": "Filtrar después de contar: HAVING, no WHERE."}, {"id": "6.6", "e": "¿En qué canales se han ingresado más de 6.000 € con las entradas? Muestra el canal y lo ingresado.", "sol": "SELECT canal, SUM(importe) FROM entradas GROUP BY canal HAVING SUM(importe) > 6000", "p": "GROUP BY canal y HAVING con la suma. En SQL los miles no llevan punto: 6000."}]}, {"id": "b7", "titulo": "7. NULL y CASE", "teoria": "<p><code>NULL</code> es una casilla vacía. No se compara con <code>=</code>: se usa <code>IS NULL</code> o <code>IS NOT NULL</code>. <code>COALESCE(columna, 'texto')</code> pone un texto donde hay NULL.</p><p><code>CASE</code> crea una columna nueva según condiciones. Se revisa de arriba abajo y gana el primer WHEN que se cumple.</p><pre>CASE\n  WHEN nota &gt;= 9 THEN 'promotor'\n  WHEN nota &gt;= 7 THEN 'neutro'\n  ELSE 'detractor'\nEND AS tipo</pre>", "ej": [{"id": "7.1", "e": "¿Qué socios no tienen email? Muestra el nombre y el apellido.", "sol": "SELECT nombre, apellido FROM socios WHERE email IS NULL", "p": "IS NULL, no = NULL."}, {"id": "7.2", "e": "¿Cuántas reseñas no tienen comentario?", "sol": "SELECT COUNT(*) FROM resenas WHERE comentario IS NULL", "p": "Usa COUNT(*): COUNT(comentario) no cuenta las casillas vacías."}, {"id": "7.3", "e": "¿Cuántas entradas compraron personas que no son socias? (socio_id vacío)", "sol": "SELECT COUNT(*) FROM entradas WHERE socio_id IS NULL", "p": "Las entradas sin socio tienen NULL en socio_id."}, {"id": "7.4", "e": "Clasifica las películas por duración: muestra el título, la duración y una columna tipo que diga 'larga' si dura 140 minutos o más, 'normal' si dura 100 o más, y 'corta' en el resto.", "sol": "SELECT titulo, duracion, CASE WHEN duracion >= 140 THEN 'larga' WHEN duracion >= 100 THEN 'normal' ELSE 'corta' END AS tipo FROM peliculas", "p": "El WHEN más exigente va primero."}, {"id": "7.5", "e": "Clasifica las reseñas como en un NPS y cuenta cuántas hay de cada tipo: 'promotor' si la nota es 9 o más, 'neutro' si es 7 o más, 'detractor' en el resto. Muestra el tipo y cuántas.", "sol": "SELECT CASE WHEN nota >= 9 THEN 'promotor' WHEN nota >= 7 THEN 'neutro' ELSE 'detractor' END AS tipo, COUNT(*) FROM resenas GROUP BY tipo", "p": "Un CASE con AS tipo en el SELECT, y GROUP BY tipo."}, {"id": "7.6", "e": "Para una campaña de email, saca el nombre de todos los socios y su email; donde no haya email tiene que poner 'SIN EMAIL'.", "sol": "SELECT nombre, COALESCE(email, 'SIN EMAIL') FROM socios", "p": "COALESCE(email, 'SIN EMAIL'). También vale un CASE con IS NULL."}]}, {"id": "mision", "titulo": "Misión", "mision": true, "teoria": "<p><b>Las entradas fantasma.</b> Jueves 12 de noviembre de 2026. Carmen, la gerente del Cine Paraíso, te llama: alguien está regalando entradas, y en el cine nadie sabe SQL.</p><p>Averigua qué pasa, quién está detrás y cuánto dinero ha dejado de ingresar el cine. Cada paso te lleva al siguiente: apunta lo que encuentres. Al final, el recuadro para acusar.</p>", "ej": [{"id": "M.1", "t": "El aviso", "e": "Empieza por la tabla incidencias. Busca la del 10 de noviembre de 2026 ('2026-11-10') del departamento 'gerencia' y lee la descripción con calma.", "sol": "SELECT * FROM incidencias WHERE fecha = '2026-11-10' AND departamento = 'gerencia'", "p": "Dos condiciones con AND."}, {"id": "M.2", "t": "Las entradas con el código", "e": "Muestra todas las entradas que usaron el código 'PASE-EQUIPO'.", "sol": "SELECT * FROM entradas WHERE codigo_promo = 'PASE-EQUIPO'", "p": "La columna es codigo_promo."}, {"id": "M.3", "t": "¿Por dónde salen?", "e": "De esas entradas, ¿cuántas hay de cada canal? Según el aviso, el personal solo puede usar el código desde la app. ¿Qué canal no cuadra?", "sol": "SELECT canal, COUNT(*) FROM entradas WHERE codigo_promo = 'PASE-EQUIPO' GROUP BY canal", "p": "WHERE con el código y GROUP BY canal."}, {"id": "M.4", "t": "¿Quién las vende?", "e": "Las entradas de taquilla las mete alguien del cine, y su id queda en vendida_por. De las entradas 'PASE-EQUIPO' vendidas en 'taquilla', ¿cuántas hay de cada vendida_por?", "sol": "SELECT vendida_por, COUNT(*) FROM entradas WHERE codigo_promo = 'PASE-EQUIPO' AND canal = 'taquilla' GROUP BY vendida_por", "p": "Dos condiciones en el WHERE y GROUP BY vendida_por."}, {"id": "M.5", "t": "¿Es ella?", "e": "Busca en empleados a quien tiene ese id. Fíjate en su turno.", "sol": "SELECT * FROM empleados WHERE id = 7", "p": "WHERE id = el número del paso anterior."}, {"id": "M.6", "t": "¿A qué horas?", "e": "¿A qué hora se vendió la primera de esas entradas de taquilla con 'PASE-EQUIPO' y a qué hora la última? Mira la columna hora_venta. Las dos en una consulta.", "sol": "SELECT MIN(hora_venta), MAX(hora_venta) FROM entradas WHERE codigo_promo = 'PASE-EQUIPO' AND canal = 'taquilla'", "p": "MIN y MAX en el mismo SELECT. ¿Encaja con su turno? El turno de tarde acaba a las 21:00."}, {"id": "M.7", "t": "El ordenador", "e": "Lee las incidencias del departamento 'sistemas'.", "sol": "SELECT * FROM incidencias WHERE departamento = 'sistemas'", "p": "Un solo WHERE."}, {"id": "M.8", "t": "El turno de noche", "e": "Si esas entradas se vendieron de noche, ¿quién trabaja en 'taquilla' en el turno de 'noche'?", "sol": "SELECT * FROM empleados WHERE puesto = 'taquilla' AND turno = 'noche'", "p": "Puesto y turno, con AND."}, {"id": "M.9", "t": "Los afortunados", "e": "¿Quién disfrutó de esas entradas gratis? De las entradas 'PASE-EQUIPO' de taquilla, cuenta cuántas tiene cada socio_id.", "sol": "SELECT socio_id, COUNT(*) FROM entradas WHERE codigo_promo = 'PASE-EQUIPO' AND canal = 'taquilla' GROUP BY socio_id", "p": "El mismo WHERE de antes y GROUP BY socio_id."}, {"id": "M.10", "t": "Caras conocidas", "e": "Busca en socios a esas personas (usa los id del paso anterior: ¿son seguidos?) y mira sus apellidos. ¿Te suena alguno del turno de noche?", "sol": "SELECT * FROM socios WHERE id BETWEEN 234 AND 239", "p": "Puedes usar IN (234, 235, ...) o, como son seguidos, BETWEEN."}, {"id": "M.11", "t": "La cuenta", "e": "¿Cuánto dinero ha dejado de ingresar el cine? Suma la columna descuento de las entradas 'PASE-EQUIPO' de taquilla.", "sol": "SELECT SUM(descuento) FROM entradas WHERE codigo_promo = 'PASE-EQUIPO' AND canal = 'taquilla'", "p": "SUM(descuento) con el mismo WHERE."}]}];
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js"></script>
<script>
(function(){
const CLAVE = 'cineParaiso_v1';
let estado = { hechos:{}, consultas:{}, bloque:'b1', caso:false };
try { const s = localStorage.getItem(CLAVE); if (s) estado = Object.assign(estado, JSON.parse(s)); } catch(e) {}
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch(e) {} }

let SQL, db, esperados = {}, ultimoTextarea = null;

function cargarScript(src){ return new Promise((ok, ko) => { const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }

async function iniciar(){
  try {
    if (typeof initSqlJs === 'undefined') await cargarScript('https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js');
    SQL = await initSqlJs();
  } catch(e) {
    document.getElementById('main').innerHTML = '<div class="cargando">No se ha podido cargar el motor de SQL. Recarga la página.</div>';
    return;
  }
  crearDB();
  for (const b of BLOQUES) for (const e of b.ej) {
    const r = db.exec(e.sol)[0];
    esperados[e.id] = r ? { cols: r.columns.length, filas: r.values.length, valores: r.values } : { cols:0, filas:0, valores:[] };
  }
  pintarTablas();
  pintarTabs();
  const h = location.hash.slice(1);
  if (BLOQUES.some(b => b.id === h)) estado.bloque = h;
  pintarBloque(estado.bloque);
}

function crearDB(){ if (db) db.close(); db = new SQL.Database(); db.run(DATA_SQL); }

// ---------- panel de tablas ----------
function pintarTablas(){
  const cont = document.getElementById('tablas');
  cont.innerHTML = '';
  const tablas = db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY rowid")[0].values.map(v => v[0]);
  for (const t of tablas) {
    const n = db.exec('SELECT COUNT(*) FROM ' + t)[0].values[0][0];
    const cols = db.exec('PRAGMA table_info(' + t + ')')[0].values.map(v => [v[1], v[2]]);
    const div = document.createElement('div'); div.className = 'tabla';
    const b = document.createElement('button');
    b.innerHTML = '<span>' + t + '</span><small>' + n + ' filas</small>';
    b.onclick = () => div.classList.toggle('abierta');
    const cd = document.createElement('div'); cd.className = 'cols';
    for (const [c, tipo] of cols) {
      const cb = document.createElement('button'); cb.className = 'col';
      cb.innerHTML = c + ' <small>' + (tipo === 'INTEGER' || tipo === 'REAL' ? 'número' : 'texto') + '</small>';
      cb.onclick = () => insertar(c);
      cd.appendChild(cb);
    }
    div.appendChild(b); div.appendChild(cd); cont.appendChild(div);
  }
}
function insertar(txt){
  const ta = ultimoTextarea; if (!ta) return;
  const i = ta.selectionStart, f = ta.selectionEnd;
  ta.value = ta.value.slice(0, i) + txt + ta.value.slice(f);
  ta.focus(); ta.selectionStart = ta.selectionEnd = i + txt.length;
  ta.dispatchEvent(new Event('input'));
}

// ---------- pestañas ----------
function cuenta(b){ return b.ej.filter(e => estado.hechos[e.id]).length; }
function pintarTabs(){
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  for (const b of BLOQUES) {
    const t = document.createElement('button'); t.className = 'tab' + (b.id === estado.bloque ? ' activa' : '');
    const c = cuenta(b);
    t.innerHTML = b.titulo + '<span class="cnt' + (c === b.ej.length ? ' lleno' : '') + '">' + c + '/' + b.ej.length + '</span>';
    t.onclick = () => { estado.bloque = b.id; guardar(); try { history.replaceState(null, '', '#' + b.id); } catch(e) {} pintarTabs(); pintarBloque(b.id); window.scrollTo(0, 0); };
    nav.appendChild(t);
  }
}

// ---------- bloque ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function textoEsperado(id){
  const x = esperados[id];
  if (x.filas === 1 && x.cols === 1) return 'un solo número';
  return x.filas + (x.filas === 1 ? ' fila' : ' filas') + ' y ' + x.cols + (x.cols === 1 ? ' columna' : ' columnas');
}
function pintarBloque(id){
  const b = BLOQUES.find(x => x.id === id) || BLOQUES[0];
  const main = document.getElementById('main');
  main.innerHTML = '<h2>' + esc(b.titulo) + '</h2><div class="teoria">' + b.teoria + '</div>';
  for (const e of b.ej) main.appendChild(tarjeta(e));
  if (b.mision) main.appendChild(cajaAcusar());
}
function tarjeta(e){
  const d = document.createElement('div'); d.className = 'ej' + (estado.hechos[e.id] ? ' hecho' : '');
  d.innerHTML =
    '<div class="cab"><span class="num">' + e.id + '</span>' + (e.t ? '<span class="tit">' + esc(e.t) + '</span>' : '') +
    '<span class="estado">' + (estado.hechos[e.id] ? '✓ Resuelto' : '') + '</span></div>' +
    '<p class="enun">' + esc(e.e) + '</p>' +
    '<div class="esperado">Resultado esperado: ' + textoEsperado(e.id) + '. <button class="linkbtn bp">Ver pista</button></div>' +
    '<div class="pista">' + esc(e.p) + '</div>' +
    '<textarea spellcheck="false" placeholder="Escribe aquí tu consulta…"></textarea>' +
    '<div class="barra"><button class="ejecutar">Ejecutar</button><span class="atajo">o Cmd/Ctrl + Enter</span>' +
    '<button class="linkbtn derecha bs">Ver solución</button></div>' +
    '<div class="sol"></div><div class="msg"></div><div class="res"></div>';
  const ta = d.querySelector('textarea');
  ta.value = estado.consultas[e.id] || '';
  ta.addEventListener('focus', () => ultimoTextarea = ta);
  ta.addEventListener('input', () => { estado.consultas[e.id] = ta.value; guardar(); });
  ta.addEventListener('keydown', ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); ejecutar(e, d); } });
  d.querySelector('.ejecutar').onclick = () => ejecutar(e, d);
  d.querySelector('.bp').onclick = () => d.querySelector('.pista').classList.toggle('ver');
  const bs = d.querySelector('.bs'), sol = d.querySelector('.sol');
  let paso = 0;
  bs.onclick = () => {
    if (paso === 0) { sol.innerHTML = '<div class="pista ver">¿Seguro? Inténtalo un poco más con la pista. Si aun así la quieres ver, vuelve a pulsar.</div>'; sol.classList.add('ver'); bs.textContent = 'Sí, enséñamela'; paso = 1; }
    else if (paso === 1) { sol.innerHTML = '<pre>' + esc(formatear(e.sol)) + '</pre>'; bs.textContent = 'Ocultar solución'; paso = 2; }
    else { sol.classList.remove('ver'); bs.textContent = 'Ver solución'; paso = 0; }
  };
  return d;
}
function formatear(s){
  return s.replace(/\s+(FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT)\s/g, '\n$1 ')
          .replace(/\s+(WHEN|ELSE|END AS)\s/g, (m, k) => '\n  ' + k + ' ') + ';';
}

// ---------- ejecutar y corregir ----------
function traducir(m){
  let x;
  if ((x = m.match(/no such table: (\S+)/))) return 'No existe la tabla <code>' + esc(x[1]) + '</code>. Mira cómo se escribe en el panel de la izquierda.';
  if ((x = m.match(/no such column: (\S+)/))) return 'No existe la columna <code>' + esc(x[1]) + '</code>. Comprueba el nombre en el panel, o si es un texto, ponlo entre comillas simples.';
  if ((x = m.match(/near "(.*?)": syntax error/))) return 'Error de sintaxis cerca de <code>' + esc(x[1]) + '</code>. Revisa comas, comillas y el orden de las cláusulas (SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT).';
  if (/incomplete input/.test(m)) return 'La consulta está incompleta: falta algo al final.';
  if (/misuse of aggregate/.test(m)) return 'Has usado una función como COUNT o SUM donde no se puede (por ejemplo en el WHERE). Para filtrar grupos se usa HAVING.';
  if (/ambiguous column/.test(m)) return 'Hay una columna ambigua.';
  return 'Error: <code>' + esc(m) + '</code>';
}
const norm = v => v === null ? '∅' : (typeof v === 'number' ? (Math.round(v * 100) / 100).toFixed(2) : String(v).trim());
function ejecutar(e, d){
  const ta = d.querySelector('textarea'), msg = d.querySelector('.msg'), res = d.querySelector('.res');
  const sql = ta.value.trim();
  msg.className = 'msg'; res.innerHTML = '';
  const mal = (h) => { msg.className = 'msg err'; msg.innerHTML = h; };
  if (!sql) return mal('Escribe una consulta primero.');
  if (/\b(drop|delete|update|insert|alter|create|replace|attach|pragma)\b/i.test(sql.replace(/'[^']*'/g, ''))) return mal('Aquí solo se practican consultas de lectura (SELECT). Si has cambiado algo sin querer, usa «Restaurar la base de datos».');
  let r;
  try { r = db.exec(sql); } catch(err) { return mal(traducir(err.message)); }
  const out = r[r.length - 1];
  if (!out) return mal('La consulta no devuelve ninguna fila. Si filtras por un texto, revisa mayúsculas, tildes y espacios.');
  pintarResultado(res, out);
  const x = esperados[e.id];
  const filas = out.values.length, cols = out.columns.length;
  if (cols !== x.cols) return mal('Te salen ' + cols + (cols === 1 ? ' columna' : ' columnas') + ' y ' + (x.cols === 1 ? 'debería ser 1' : 'deberían ser ' + x.cols) + '. Mira qué columnas pide el enunciado.');
  if (filas !== x.filas) return mal('Te salen ' + filas + (filas === 1 ? ' fila' : ' filas') + ' y ' + (x.filas === 1 ? 'debería salir 1' : 'deberían salir ' + x.filas) + '. Revisa las condiciones del WHERE' + (x.filas === 1 && filas > 1 ? ', o si tienes que resumir con una función' : '') + '.');
  const a = out.values.map(f => f.map(norm).join('|')).sort();
  const b = x.valores.map(f => f.map(norm).join('|')).sort();
  if (a.join('\n') !== b.join('\n')) {
    // columnas en otro orden
    const as = out.values.map(f => f.map(norm).sort().join('|')).sort().join('\n');
    const bs = x.valores.map(f => f.map(norm).sort().join('|')).sort().join('\n');
    if (as === bs) return mal('Los datos son correctos, pero las columnas están en otro orden. Ponlas en el orden del enunciado.');
    return mal('Salen las filas y columnas que tocan, pero los datos no coinciden. Revisa qué columnas eliges y las condiciones.');
  }
  if (e.orden) {
    const [c, desc] = e.orden;
    for (let i = 1; i < out.values.length; i++) {
      const p = out.values[i - 1][c], q = out.values[i][c];
      if (desc ? p < q : p > q) return mal('Las filas son las correctas, pero no están en el orden que pide el enunciado.');
    }
  }
  msg.className = 'msg ok';
  msg.innerHTML = ['¡Correcto!', '¡Bien hecho!', '¡Eso es!', '¡Perfecto!'][Math.floor(Math.random() * 4)] + (e.id.startsWith('M.') ? ' Lee el resultado con calma y apunta lo que te sirva.' : '');
  if (!estado.hechos[e.id]) {
    estado.hechos[e.id] = true; guardar();
    d.classList.add('hecho'); d.querySelector('.estado').textContent = '✓ Resuelto';
    pintarTabs();
  }
}
function pintarResultado(cont, out){
  const max = 60;
  let h = '<table><thead><tr>' + out.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
  for (const f of out.values.slice(0, max)) {
    h += '<tr>' + f.map(v => v === null ? '<td class="null">NULL</td>' : '<td' + (String(v).length > 60 ? ' class="largo"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>';
  }
  h += '</tbody></table>';
  if (out.values.length > max) h += '<div class="mas">… y ' + (out.values.length - max) + ' filas más (' + out.values.length + ' en total).</div>';
  else h += '<div class="mas">' + out.values.length + (out.values.length === 1 ? ' fila' : ' filas') + '.</div>';
  cont.innerHTML = h;
}

// ---------- acusar ----------
function cajaAcusar(){
  const d = document.createElement('div'); d.className = 'acusar';
  d.innerHTML = '<h3>Acusar</h3><p>Cuando lo tengas claro, escribe el nombre y el apellido de quien crees que está detrás y cuánto dinero ha dejado de ingresar el cine.</p>' +
    '<form><input id="acusado" placeholder="Nombre y apellido" autocomplete="off"><input id="importe" placeholder="Dinero perdido (€)" inputmode="decimal" autocomplete="off"><button class="ejecutar" type="submit">Acusar</button></form><div class="msg"></div>';
  const msg = d.querySelector('.msg');
  if (estado.caso) { msg.className = 'msg ok'; msg.innerHTML = '<b>Caso cerrado.</b> Ya lo resolviste: Raúl Quintero, 330,50 €.'; }
  d.querySelector('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const n = d.querySelector('#acusado').value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const imp = parseFloat(d.querySelector('#importe').value.replace(/[€\s]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
    const mal = h => { msg.className = 'msg err'; msg.innerHTML = h; };
    if (!n.trim()) return mal('Escribe un nombre.');
    if (n.includes('laura') || n.includes('mendez')) return mal('Laura, ofendida: «Yo me voy a casa a las nueve. Mira bien a qué hora se vendieron esas entradas y cuál es mi turno».');
    if (n.includes('nerea') || n.includes('diaz')) return mal('Nerea: «Yo trabajo de noche, sí, pero no conozco a ninguno de esos socios. ¿Has mirado sus apellidos?».');
    if (n.includes('navarro') || n.includes('oscar')) return mal('Óscar: «Navarro es medio Tenerife. Además, yo trabajo de tarde y a las nueve ya me he ido».');
    if (!(n.includes('raul') && n.includes('quintero'))) return mal('Carmen: «No me cuadra. Repasa el turno de noche y los apellidos de los socios».');
    if (isNaN(imp)) return mal('La persona es la correcta. Ahora escribe cuánto dinero ha dejado de ingresar el cine.');
    if (Math.abs(imp - 330.5) > 0.011) return mal('La persona es la correcta, pero la cifra no. Suma la columna descuento de las entradas PASE-EQUIPO de taquilla (paso M.11).');
    estado.caso = true; guardar();
    msg.className = 'msg ok';
    msg.innerHTML = '<b>¡Caso cerrado!</b> Raúl Quintero, taquillero de noche desde agosto, usaba la sesión que Laura dejaba abierta para regalar entradas a su familia y amigos con el código del personal. El cine ha dejado de ingresar <b>330,50 €</b>. Carmen ya ha pedido que las sesiones se cierren solas al acabar cada turno.';
  });
  return d;
}

document.getElementById('restaurar').onclick = () => { crearDB(); pintarTablas(); const b = document.getElementById('restaurar'); b.textContent = 'Restaurada ✓'; setTimeout(() => b.textContent = 'Restaurar la base de datos', 1500); };
let borrarPaso = false;
document.getElementById('borrar').onclick = (ev) => {
  const b = ev.currentTarget;
  if (!borrarPaso) { borrarPaso = true; b.textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { borrarPaso = false; b.textContent = 'Borrar mi progreso'; }, 3000); return; }
  estado = { hechos:{}, consultas:{}, bloque:'b1', caso:false }; guardar(); borrarPaso = false; b.textContent = 'Borrar mi progreso'; pintarTabs(); pintarBloque('b1');
};
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (BLOQUES.some(b => b.id === h) && h !== estado.bloque) { estado.bloque = h; guardar(); pintarTabs(); pintarBloque(h); } });
iniciar();
})();
</script>
